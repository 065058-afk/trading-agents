student: C
capital: 100000
high_beta: [AMD, TER, DAL, FCX]
diversified: [CSCO, MA, MRK, WMT, COP, SO, UNP, AMZN, LIN, O, TMO]
high_beta_share_base: 0.45
high_beta_share_range: [0.35, 0.60]
max_position_pct_high_beta: 0.15
max_position_pct_diversified: 0.10
min_order_pct: 0.01
signal_weights: {trend: 0.20, rotation: 0.20, breakout: 0.15, dip: 0.15, ml: 0.20, news: 0.10}
risk:
  atr_trailing_stop: 2.5
  partial_profit_atr: 2.0
  time_stop_days: 5
  drawdown_breaker_pct: 0.06
  earnings_guard_days: 2
llm:
  temperature: 0.1
  max_tokens: 1024
  provider_order: [ollama_local, ollama_cloud, groq]
  providers:
    groq:
      model: openai/gpt-oss-20b
      base_url: https://api.groq.com/openai/v1
    ollama_cloud:
      model: gpt-oss:20b
      base_url: https://ollama.com/v1
      api_key_env: OLLAMA_API_KEY
    ollama_local:
      model: qwen3:0.6b
      base_url: http://localhost:11434
