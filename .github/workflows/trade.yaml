name: trade
on:
  schedule:
    - cron: "0 14 * * 1-5"   # run 1, 10:00 ET in daylight time = 7:30 pm IST
    - cron: "0 15 * * 1-5"   # run 1, 10:00 ET in standard time = 8:30 pm IST
    - cron: "0 19 * * 1-5"   # run 2, 15:00 ET in daylight time = 12:30 am IST
    - cron: "0 20 * * 1-5"   # run 2, 15:00 ET in standard time = 1:30 am IST
  workflow_dispatch:
    inputs:
      mode:
        description: "dry or live"
        default: "dry"
      force_clock:
        description: "Bypass the market clock in dry mode"
        type: boolean
        default: false
      slot:
        description: "Trading slot"
        type: choice
        options:
          - auto
          - am
          - pm
        default: auto
concurrency:
  group: trade
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start Ollama and pull Qwen
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || {
            echo "Ollama failed to start"
            cat /tmp/ollama.log
            exit 1
          }
          ollama pull qwen3:0.6b
      - name: Run all students
        env:
          ALPACA_KEY_A: ${{ secrets.ALPACA_KEY_A }}
          ALPACA_SECRET_A: ${{ secrets.ALPACA_SECRET_A }}
          ALPACA_KEY_B: ${{ secrets.ALPACA_KEY_B }}
          ALPACA_SECRET_B: ${{ secrets.ALPACA_SECRET_B }}
          ALPACA_KEY_C: ${{ secrets.ALPACA_KEY_C }}
          ALPACA_SECRET_C: ${{ secrets.ALPACA_SECRET_C }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_MODEL_FALLBACK: ${{ vars.GROQ_MODEL_FALLBACK }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED }}
          MODE: ${{ github.event.inputs.mode || 'live' }}
          FORCE_CLOCK: ${{ github.event.inputs.force_clock || 'false' }}
          SLOT: ${{ github.event.inputs.slot || 'auto' }}
        run: |
          status=0
          force_clock_args=()
          if [[ "$MODE" == "dry" && "$FORCE_CLOCK" == "true" ]]; then
            force_clock_args+=(--force-clock)
          fi
          for s in A B C; do
            python run_cycle.py --student "$s" --mode "$MODE" --slot "$SLOT" "${force_clock_args[@]}" || status=1
          done
          exit $status
      - name: Save logs, cache and models
        if: always()
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"
          git add logs data models experiments
          git diff --cached --quiet || git commit -m "run $(date -u +%F) [skip ci]"
          git pull --rebase
          git push